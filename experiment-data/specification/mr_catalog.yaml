
categories:
 - id: MR1
   name: compiler_version
   description: "Tests compatibility across different compiler versions"
   mr_count: 6
   target_operation: contractCompiler
   mutable_parameter: compiler_version

 - id: MR2
   name: EOA
   description: "Validates behavior under variations in external account addresses"
   mr_count: 4
   target_operation: contractDeploy
   mutable_parameter: deployer_account

 - id: MR3
   name: deployment_environment
   description: "Ensures consistent behavior across blockchain platforms"
   mr_count: 2
   target_operation: [contractDeploy, contractFunctionCall]
   mutable_parameter: deployment_environment

 - id: MR4
   name: Gas_limit
   description: "Tests robustness against different gas limits near operational thresholds"
   mr_count: 6
   target_operation: contractDeploy
   mutable_parameter: gas_limit

 - id: MR5
   name: to
   description: "Examines token receipt behavior under recipient address variations"
   mr_count: 5
   target_operation: sendCoin
   mutable_parameter: to

 - id: MR6
   name: amount
   description: "Evaluates correctness under varied transfer amount calculations"
   mr_count: 7
   target_operation: sendCoin
   mutable_parameter: amount

 - id: MR7
   name: addr
   description: "Verifies getBalance behavior under multiple address scenarios"
   mr_count: 4
   target_operation: getBalance
   mutable_parameter: addr

 - id: MR8
   name: "(from, to)"
   description: "Assesses interaction patterns between sender and recipient accounts"
   mr_count: 3
   target_operation: sendCoin
   mutable_parameter: [from, to]

 - id: MR9
   name: "(to, amount)"
   description: "Tests the impact of input parameter ordering in transfer operations"
   mr_count: 1
   target_operation: sendCoin
   mutable_parameter: [to, amount]

mrs:
 # MR1: Compiler-Version-Based MRs
 - id: MR1.1
   category: MR1
   name: "Compiler version increase (valid range)"
   subject:
    contract: MyToken
    function: contractCompiler
   mutable_parameters:
    - name: compiler_version
      location: deployment
      type: version_identifier
      constraints: ["x_s > 0.4.11"]
   source_test:
    caller: null
    value: null
    arguments: []
    preconditions: ["x_s > 0.4.11"]
   transformation:
    type: increase
    description: "x_f = x_s + Δx"
    operations: ["increase compiler version"]
   followup_test:
    caller: null
    value: null
    arguments: []
    preconditions: ["x_f > 0.4.11"]
   oracle:
    observation_fields: [mu, epsilon, delta]
    relation: equal
    expression: "(μ_f = μ_s, ε_f = ε_s, δ_f = δ_s)"
   execution_semantics:
    same_deployment: false
    reset_state: true
    ordered_execution: false
   automation:
    executable: false
    missing_information: ["contract-level binding and Oracle record"]

